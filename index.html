<head>
    <meta charset="UTF-8">

    <style>
        body {
            h1 {
            background-color: darkred;
            color: white;
            text-align: center;
            }
            background-color: cornsilk;
        }
        div {
            border: 1px solid gray;

padding: 10px;
width: 95%;
        }

        p {
            text-align: center;
        }

        div {

.Movie title {
    padding: 10px;
}

background-color:darkred;
color: white;

  background-color: white;
color: darkred;

<body>
    <h1>Rate A Movie</h1>
    <p>Share your top pick movie and write a review.</p>
    
    <div class="box">
<img src="https://png.pngtree.com/element_pic/16/11/18/4f829e85866bd52d062ca58b4e1ecef5.png" alt="" width="100px" height="100px">
<form action=""></form>
<input type="text" placeholder="Enter a Movie Title" class="Movie Title">

<fieldset>
   <legend>Genres (select all that apply):</legend> 
      <input type="Checkbox">
        <label>Action</label>
    
          <input type="Checkbox">
        <label>Drama</label>
  
          <input type="Checkbox">
        <label>Comedy</label>
       
          <input type="Checkbox">
        <label>Fantasy</label>
       
        <input type="Checkbox">
        <label>Sci-Fi</label>

                    <label for="ratings"><strong>Rating:</strong></label> <br>
            
                    <input type="radio" id="1" name="rating">
            <label for="1">⭐</label><br>
           
            <input type="radio" id="2" name="rating">
            <label for="2">⭐⭐</label><br>
            
            <input type="radio" id="3" name="rating">
            <label for="3">⭐⭐⭐</label><br>
           
            <input type="radio" id="4" name="rating">
            <label for="4">⭐⭐⭐⭐</label><br>
          
            <input type="radio" id="5" name="rating">
            <label for="5">⭐⭐⭐⭐⭐</label><br><br>

            <input type="text" placeholder="Write your review..." style="width: 200px; height: 50px; border-radius: 7px; border: 1px solid; text-align: center; margin-bottom: 2px;"><br>

            <input type="submit" value="Submit Review" style="width: 100%; height: 25px; border-radius: 7px; border: 1px solid; text-align: center;" class="button">
           
            <p class="Tips">Movie review tips: <a href="">Click here</a></p> <br>
        </form>

    </div>
    <br>
        
</fieldset>
